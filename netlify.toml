[build]
  publish = "."
  functions = "netlify/functions"

# No redirect needed — index.html is served automatically

# Cache static assets aggressively
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# All pages formerly on Squarespace (/community, /going-solo, /top50creatorjournalists)
# are now served from this site. Their Squarespace redirects were removed.

# Scheduled function: daily lifecycle emails (day-3 follow-up, cohort reminders)
# Runs every day at 2pm UTC (10am Eastern)
[functions."community-scheduled-emails"]
schedule = "0 14 * * *"

# Install function-level dependencies automatically
[[plugins]]
  package = "@netlify/plugin-functions-install-core"
